# Math Calculator Workflow - Simple prototype to validate architecture
name: math_calculator
display_name: "Math Calculator"
version: "1.1"
description: "Validates numbers, performs calculation, formats result"

trigger:
  schema:
    type: object
    required:
      - a
      - b
      - operation
    properties:
      a:
        type: number
        title: "First Number (a)"
        description: "The first operand"
      b:
        type: number
        title: "Second Number (b)"
        description: "The second operand"
      operation:
        type: string
        title: "Operation"
        description: "The arithmetic operation to perform"
        enum:
          - add
          - subtract
          - multiply
          - divide
        default: add

  ui_hints:
    layout: horizontal
    submit_label: "Calculate"

nodes:
  # --- Node 1: Validate Input ---
  - id: validate_numbers
    type: function
    description: Validate that numbers and operation are valid
    config:
      path: "actions.logic.validate_numbers"
      params:
        a: "{{a}}"
        b: "{{b}}"
        operation: "{{operation}}"
    routes:
      success: calculate
      invalid: __END__

  # --- Node 2: Perform Calculation ---
  - id: calculate
    type: function
    description: Perform the arithmetic calculation
    config:
      path: "actions.logic.calculate"
      params:
        validated_a: "{{validated_a}}"
        validated_b: "{{validated_b}}"
        validated_operation: "{{validated_operation}}"
    routes:
      success: format_result
      error: __END__

  # --- Node 3: Format Result ---
  - id: format_result
    type: function
    description: Format the calculation result for display
    config:
      path: "actions.logic.format_result"
      params:
        validated_a: "{{validated_a}}"
        validated_b: "{{validated_b}}"
        validated_operation: "{{validated_operation}}"
        result: "{{result}}"
    routes:
      success: __END__
