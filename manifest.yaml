# manifest.yaml - declares all workflows in this repository
name: "orkest-team"
version: "1.0"
author: "Orkest"

workflows:
  # YAML-based workflow (current Orkest standard)
  - path: "workflows/math_calculator"
    enabled: true
    description: "Math Calculator - performs arithmetic operations (add, subtract, multiply, divide)"

  # LangGraph-based workflow (experimental - not yet supported by Orkest)
